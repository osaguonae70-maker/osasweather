<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose a new password · OsasWeather</title>
<meta name="description" content="Choose a new OsasWeather password.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1b2c">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<link rel="preload" href="assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/tailwind.min.css">
<link rel="stylesheet" href="assets/css/app.css">
<script src="assets/js/config.js"></script>
<script src="assets/js/theme-init.js"></script>
</head>
<body>
<div class="osw-auth">
  <div class="osw-auth-form">
    <header><a class="osw-brand" href="index.html"><img src="assets/images/logo-icon.svg" alt="" width="34" height="34"><span><b>Osas</b><span>Weather</span></span></a></header>
    <main id="main" class="inner">
      <h1>Choose a new password</h1>
      <div data-banner hidden></div>
      <div data-checking class="osw-muted tw-mt-4">Checking your reset link…</div>
      <form data-form novalidate class="tw-mt-4" hidden>
      <div class="mb-3">
        <label class="form-label" for="password">New password</label>
        <div class="osw-pw"><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required maxlength="128">
          <button type="button" data-toggle-pw aria-label="Show password" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button></div>
        <div class="osw-field-error" data-error-for="password" role="alert"></div><div class="osw-meter" data-score="0" data-meter aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="osw-hint" data-strength-hint>Use at least 10 characters with a letter and a number.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirmPassword">Confirm new password</label>
        <div class="osw-pw"><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required maxlength="128">
          <button type="button" data-toggle-pw aria-label="Show password" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button></div>
        <div class="osw-field-error" data-error-for="confirmPassword" role="alert"></div>
      </div>
        <button class="btn btn-sun w-100" type="submit">Update password</button>
      </form>
      <div data-invalid hidden class="tw-mt-4"><p>This reset link is invalid, has expired, or was already used.</p><a class="btn btn-sun" href="forgot-password.html">Request a new link</a></div>
    </main>
  </div>
  <aside class="osw-auth-side" aria-hidden="true"><div data-side-icon></div><h2>Almost there.</h2><p>Choosing a new password signs you out on all other devices.</p></aside>
</div>
<script type="module" src="assets/js/pages/reset.js"></script>
</body></html>
