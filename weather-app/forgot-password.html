<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot password · OsasWeather</title>
<meta name="description" content="Reset your OsasWeather password.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1b2c">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<link rel="preload" href="assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/tailwind.min.css">
<link rel="stylesheet" href="assets/css/app.css">
<script src="assets/js/config.js"></script>
<script src="assets/js/theme-init.js"></script>
</head>
<body>
<div class="osw-auth">
  <div class="osw-auth-form">
    <header><a class="osw-brand" href="index.html"><img src="assets/images/logo-icon.svg" alt="" width="34" height="34"><span><b>Osas</b><span>Weather</span></span></a></header>
    <main id="main" class="inner">
      <h1>Reset your password</h1>
      <p class="osw-muted">Enter the email you registered with and we will send a link to choose a new password.</p>
      <div data-banner hidden></div>
      <form data-form novalidate class="tw-mt-4">
        <div class="mb-4"><label class="form-label" for="email">Email address</label>
          <input class="form-control" id="email" name="email" type="email" autocomplete="email" required maxlength="254" inputmode="email">
          <div class="osw-field-error" data-error-for="email" role="alert"></div></div>
        <button class="btn btn-sun w-100" type="submit">Send reset link</button>
      </form>
      <p class="osw-muted tw-mt-4 mb-0"><a href="login.html">Back to log in</a></p>
    </main>
  </div>
  <aside class="osw-auth-side" aria-hidden="true"><div data-side-icon></div><h2>Locked out?</h2><p>Reset links expire after 30 minutes and work once.</p></aside>
</div>
<script type="module" src="assets/js/pages/forgot.js"></script>
</body></html>
