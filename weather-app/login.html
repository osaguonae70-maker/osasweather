<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · OsasWeather</title>
<meta name="description" content="Log in to your OsasWeather account.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1b2c">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<link rel="preload" href="assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/tailwind.min.css">
<link rel="stylesheet" href="assets/css/app.css">
<script src="assets/js/config.js"></script>
<script src="assets/js/theme-init.js"></script>
</head>
<body>
<div class="osw-auth">
  <div class="osw-auth-form">
    <header><a class="osw-brand" href="index.html"><img src="assets/images/logo-icon.svg" alt="" width="34" height="34"><span><b>Osas</b><span>Weather</span></span></a></header>
    <main id="main" class="inner">
      <h1>Welcome back</h1>
      <p class="osw-muted">Log in to see your forecast, favourites and settings.</p>
      <div data-banner hidden></div>
      <form data-form novalidate class="tw-mt-4">
        <div class="mb-3"><label class="form-label" for="email">Email address</label>
          <input class="form-control" id="email" name="email" type="email" autocomplete="email" required maxlength="254" inputmode="email">
          <div class="osw-field-error" data-error-for="email" role="alert"></div></div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="osw-pw"><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
          <button type="button" data-toggle-pw aria-label="Show password" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button></div>
        <div class="osw-field-error" data-error-for="password" role="alert"></div>
      </div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
          <label class="osw-check"><input type="checkbox" name="rememberMe"><span>Remember me for 30 days</span></label>
          <a href="forgot-password.html">Forgot password?</a></div>
        <button class="btn btn-sun w-100" type="submit">Log in</button>
      </form>
      <p class="osw-muted tw-mt-4 mb-0">New to OsasWeather? <a href="register.html">Create an account</a></p>
    </main>
  </div>
  <aside class="osw-auth-side" aria-hidden="true"><div data-side-icon></div><h2>Welcome back.</h2><p>Your favourite places and preferences are waiting on every device you use.</p></aside>
</div>
<script type="module" src="assets/js/pages/login.js"></script>
</body></html>
