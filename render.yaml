# Render Blueprint for the shared backend + its PostgreSQL database.
# Dashboard: New > Blueprint > select this repository. The frontends deploy separately on Vercel.
databases:
  - name: osasweather-db
    plan: basic-256mb        # pick a plan that fits your needs; the free tier expires
    postgresMajorVersion: "16"
    databaseName: osasweather
    user: osasweather

services:
  - type: web
    name: osasweather-api
    runtime: node
    rootDir: backend
    plan: starter
    region: frankfurt        # choose the region closest to your users and database
    buildCommand: npm ci --omit=dev
    # Migrations are transactional, idempotent and guarded by a Postgres advisory lock, so running them
    # on every start is safe even if two instances boot together.
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: osasweather-db, property: connectionString }
      - key: DATABASE_SSL
        value: "false"       # internal connection string; set "true" if you use the external URL
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false          # e.g. https://osasweather.com
      - key: ADMIN_FRONTEND_URL
        sync: false          # e.g. https://admin.osasweather.com
      - key: ALLOWED_ORIGINS
        sync: false          # comma-separated: https://osasweather.com,https://admin.osasweather.com
      - key: COOKIE_SAMESITE
        value: lax
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
